name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # Fast lane. No infrastructure, so it fails a broken pull request in seconds.
  # ---------------------------------------------------------------------------
  python-static:
    name: Python — format, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e "apps/api[postgres,dev]" -e apps/worker

      - name: Format check (ruff)
        run: ruff format --check apps/api apps/worker

      - name: Lint (ruff)
        run: ruff check apps/api apps/worker

      - name: Type check (mypy --strict)
        # Strict is mandatory (ADR-002 §1). Loosening it requires an ADR
        # reference in the pull request.
        run: |
          cd apps/api && mypy
          cd ../worker && mypy

  # ---------------------------------------------------------------------------
  # Database-backed suites. Every release-gating security check runs here, each
  # as its own step so a failure names the guarantee it broke.
  # ---------------------------------------------------------------------------
  python-tests:
    name: Python — migrations, unit, integration, security
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: eip
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d eip"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      EIP_ENV: ci
      EIP_LOG_FORMAT: json
      EIP_DB_APP_DSN: postgresql+asyncpg://eip_app:local_dev_only@localhost:5432/eip
      EIP_DB_PLATFORM_DSN: postgresql+asyncpg://eip_platform:local_dev_only@localhost:5432/eip
      EIP_DB_MIGRATOR_DSN: postgresql+asyncpg://eip_migrator:local_dev_only@localhost:5432/eip
      EIP_REDIS_URL: redis://localhost:6379/0
      EIP_AUTH_DEV_SIGNING_SECRET: ci-only-not-a-real-secret-value-32-bytes

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e "apps/api[postgres,dev]" -e apps/worker

      - name: Create database roles
        # The role split is load-bearing. eip_app must be NOINHERIT and
        # NOBYPASSRLS, or the analytical-isolation suite would pass vacuously
        # (ADR-003 §2).
        run: |
          export PGPASSWORD=local_dev_only
          psql -h localhost -U postgres -d eip -v ON_ERROR_STOP=1 \
            -f infra/postgres/init/00-roles.sql

      - name: Run migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Verify migrations are reversible
        # A migration that cannot be rolled back cannot be deployed safely.
        working-directory: apps/api
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Verify no model drift
        # An empty autogenerate diff proves the ORM models and the migrated
        # schema agree. Drift means production schema and code disagree.
        working-directory: apps/api
        run: |
          alembic revision --autogenerate -m "drift check" --rev-id drift_check
          if grep -qE "op\.(create|drop|alter|add)" migrations/versions/drift_check_*.py; then
            echo "::error::Model drift detected — the ORM models and migrations disagree."
            cat migrations/versions/drift_check_*.py
            exit 1
          fi
          rm migrations/versions/drift_check_*.py

      - name: Unit and architecture tests
        working-directory: apps/api
        run: pytest tests/unit tests/architecture -q

      - name: Integration tests
        working-directory: apps/api
        run: pytest tests/integration -q

      # -----------------------------------------------------------------------
      # RELEASE-GATING. A failure in any step below is a security defect, not a
      # flake. Split by guarantee so the job summary names what broke.
      # -----------------------------------------------------------------------
      - name: 'SECURITY: control-plane tenant isolation'
        working-directory: apps/api
        run: pytest tests/security/test_tenant_isolation.py -v

      - name: 'SECURITY: per-tenant analytical credentials (G10)'
        working-directory: apps/api
        run: pytest tests/security/test_analytical_credentials.py -v

      - name: 'SECURITY: operator-driven tenant provisioning'
        working-directory: apps/api
        run: pytest tests/security/test_tenant_provisioning.py -v

      - name: 'SECURITY: audit tamper evidence'
        working-directory: apps/api
        run: pytest tests/security/test_audit_tamper_evidence.py -v

      - name: 'SECURITY: production token verification'
        working-directory: apps/api
        run: pytest tests/security/test_oidc_verification.py -v

      - name: 'SECURITY: privileged platform access'
        working-directory: apps/api
        run: pytest tests/security/test_privileged_platform_access.py -v

      - name: 'SECURITY: audit integrity and authorization'
        working-directory: apps/api
        run: pytest tests/security/test_audit_and_authorization.py -v

      - name: 'SECURITY: data-source isolation and fenced connection tests'
        working-directory: apps/api
        run: pytest tests/security/test_data_source_management.py tests/security/test_connection_test_fencing.py -v

      - name: 'SECURITY: worker privileges and background isolation'
        working-directory: apps/worker
        run: pytest -v

  # ---------------------------------------------------------------------------
  # RELEASE-GATING. Its own job because it needs a real identity provider, which
  # the other suites do not. Phase 1A's OIDC tests ran entirely offline — that
  # proved the cryptography and left the protocol untested (gap G13).
  # ---------------------------------------------------------------------------
  oidc-integration:
    name: 'SECURITY: OIDC against a real identity provider'
    runs-on: ubuntu-latest

    env:
      EIP_ENV: ci
      EIP_LOG_FORMAT: json
      EIP_DB_APP_DSN: postgresql+asyncpg://eip_app:local_dev_only@localhost:5432/eip
      EIP_DB_PLATFORM_DSN: postgresql+asyncpg://eip_platform:local_dev_only@localhost:5432/eip
      EIP_DB_MIGRATOR_DSN: postgresql+asyncpg://eip_migrator:local_dev_only@localhost:5432/eip
      EIP_AUTH_DEV_SIGNING_SECRET: ci-only-not-a-real-secret-value-32-bytes
      EIP_TEST_OIDC_BASE_URL: http://localhost:8081
      # Turns "provider missing" from a skip into a failure. A green job whose
      # security tests never ran is worse than a red one.
      EIP_TEST_OIDC_REQUIRED: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e "apps/api[postgres,dev]"

      - name: Start PostgreSQL and Keycloak
        # Compose rather than service containers: the Keycloak realms are
        # imported from a mounted directory, and service containers cannot
        # mount anything.
        run: docker compose -f infra/docker-compose.yml --profile oidc up -d --wait postgres keycloak

      - name: Run migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: 'SECURITY: discovery, verification, rotation, membership binding'
        working-directory: apps/api
        run: pytest tests/security/test_oidc_keycloak.py -v

      - name: Dump identity-provider logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml --profile oidc logs --tail 200 keycloak

      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml --profile oidc down -v

  web:
    name: Web — lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here — the root package.json pins `packageManager`,
      # and specifying both is an error in action-setup v4.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @eip/web build

  # ---------------------------------------------------------------------------
  # RELEASE-GATING. The browser suite (ADR-001's `tests/e2e`, absent until now —
  # gap G3). Its own job because it needs the whole stack plus a browser, and
  # because a failure here should name the guarantee rather than "the web build
  # broke".
  # ---------------------------------------------------------------------------
  browser-e2e:
    name: 'SECURITY: tenant isolation in the browser'
    runs-on: ubuntu-latest

    env:
      EIP_API_BASE_URL: http://localhost:8000
      EIP_WEB_BASE_URL: http://localhost:3000
      EIP_ENV: local

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Start the stack
        run: docker compose -f infra/docker-compose.yml --profile app up -d --build --wait

      - name: Seed two organizations
        # Two, not one. Tenant isolation cannot be observed with a single
        # tenant, and this suite exists to observe it.
        run: |
          docker compose -f infra/docker-compose.yml exec -T api \
            sh -c "cd /app/apps/api && python -m eip.scripts.seed_demo"

      - run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm --filter @eip/e2e exec playwright install --with-deps chromium

      - name: Build and start the web application
        run: |
          pnpm --filter @eip/web build
          pnpm --filter @eip/web start &
          npx --yes wait-on http://localhost:3000/sign-in --timeout 90000

      - name: 'SECURITY: header and URL manipulation toward another tenant'
        run: pnpm --filter @eip/e2e exec playwright test

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-diagnostics
          # Redacted at capture (`support/diagnostics.ts`). Playwright's trace
          # and video are disabled precisely because they would record complete
          # request headers, and this artefact is downloadable.
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml --profile app logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml --profile app down -v

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test the environment-file check
        # The check itself is tested. The previous implementation used a PCRE
        # negative lookahead with `grep -E`, which POSIX ERE does not support,
        # so `.env.production` passed silently. A guard nobody has watched fail
        # is not a guard.
        run: bash infra/scripts/test-check-no-env-files.sh

      - name: Reject committed environment files
        run: bash infra/scripts/check-no-env-files.sh

      - name: Scan for credential-shaped strings
        run: |
          set +e
          PATTERN='(BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{32,}|ghp_[A-Za-z0-9]{36}|xox[baprs]-)'
          MATCHES=$(git grep -nIE "$PATTERN" -- . ':!*.lock' ':!pnpm-lock.yaml')
          if [ -n "$MATCHES" ]; then
            echo "::error::Possible secret committed:"
            echo "$MATCHES"
            exit 1
          fi
          echo "No credential-shaped strings found."

  # ---------------------------------------------------------------------------
  # Proves the documented startup sequence works, and that the committed API
  # contract matches the running API.
  # ---------------------------------------------------------------------------
  stack-smoke:
    name: Local stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here — the root package.json pins `packageManager`,
      # and specifying both is an error in action-setup v4.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Start the stack
        run: docker compose -f infra/docker-compose.yml --profile app up -d --build --wait

      - name: API liveness and readiness
        run: |
          curl -fsS http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://localhost:8000/ready  | tee /dev/stderr | grep -q '"status":"ready"'

      - name: Worker liveness and readiness
        run: |
          curl -fsS http://localhost:8001/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:8001/ready  | grep -q '"status":"ready"'

      - name: API contract has not drifted
        # The committed OpenAPI document is the contract of record (ADR-001).
        # An endpoint cannot change without that change being visible in the
        # diff.
        env:
          EIP_API_BASE_URL: http://localhost:8000
        run: node packages/contracts/scripts/sync-openapi.mjs --check

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml --profile app logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml --profile app down -v
