[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# The DSN is NOT set here. It is read from EIP_DB_MIGRATOR_DSN by
# migrations/env.py so that no credential — not even a local one — is
# committed to source control (ADR-015, guardrail 9).
sqlalchemy.url =

[post_write_hooks]
# `exec` rather than `console_scripts`: the latter resolves through the
# installed distribution's entry points, which fails with an editable install
# in CI ("Could not find entrypoint console_scripts.ruff"). Invoking the
# executable works in both environments.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
