# Local development environment for TriVera EIP.
#
#   docker compose -f infra/docker-compose.yml up -d
#
# Brings up PostgreSQL, Redis, the migration job, the API, and the worker.
# The frontend runs on the host (`pnpm dev` in apps/web) because Next.js's
# dev loop is materially faster outside a container and it needs no native
# dependencies.
#
# Profiles:
#   (default)          infrastructure only — postgres + redis
#   --profile app      infrastructure + migrate + api + worker
#
# Containerising the Python services is not incidental: asyncpg is a C
# extension with no wheel on some developer platforms (Windows/ARM64 among
# them), so the container is what makes the environment genuinely
# reproducible rather than "works if you have a compiler".

name: trivera-eip

services:
  postgres:
    image: postgres:16-alpine
    container_name: eip-postgres
    environment:
      # Local development only. Never a real credential (ADR-015).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: eip
      # Deterministic collation so ordering is identical across machines.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5432:5432'
    volumes:
      - eip_pgdata:/var/lib/postgresql/data
      # Runs once, on an empty data directory, in filename order.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      # Surfaces the tenant/metric/plan tags the governed query path will
      # attach later (ADR-007 §5, ADR-014 §7).
      - 'postgres'
      - '-c'
      - 'shared_preload_libraries=pg_stat_statements'
      - '-c'
      - 'log_min_duration_statement=500'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d eip']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: eip-redis
    ports:
      # Published on 6380 by default. 6379 collides with a stray local Redis
      # often enough that defaulting to it costs more time than it saves.
      # Override with EIP_REDIS_HOST_PORT and keep EIP_REDIS_URL in sync.
      - '${EIP_REDIS_HOST_PORT:-6380}:6379'
    # Cache + broker duty are logically separated by database index
    # (ADR-009 Consequences). No persistence: Redis is never the system of
    # record — durable state lives in PostgreSQL.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  # --- identity provider (profile: oidc) ----------------------------------

  # A real OIDC provider for the integration suite. Phase 1A verified the OIDC
  # adapter against in-process RSA keys and a local JWKS server, which proved
  # the cryptography but not the protocol: discovery, realm-scoped issuers,
  # Keycloak's `aud` behaviour, and live key rotation were all untested. That
  # was gap G13.
  #
  # Not started by default — it costs ~15s and only one suite needs it:
  #   docker compose -f infra/docker-compose.yml --profile oidc up -d --wait
  keycloak:
    profiles: ['oidc']
    image: quay.io/keycloak/keycloak:26.0
    container_name: eip-keycloak
    environment:
      # Local development only. The admin API is used by the test suite to
      # register signing keys and to force a rotation (ADR-010 §1).
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local_dev_only
      KC_HEALTH_ENABLED: 'true'
      KC_HTTP_ENABLED: 'true'
    command: ['start-dev', '--import-realm']
    ports:
      # 8081, not 8080: 8080 collides with almost everything.
      - '${EIP_KEYCLOAK_HOST_PORT:-8081}:8080'
    volumes:
      # Imported on first start, in filename order. Realms are configuration,
      # not clicks — a hand-configured IdP is a fixture nobody can recreate.
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image ships neither curl nor wget. Bash's /dev/tcp is the approach
      # Keycloak's own documentation recommends for exactly this reason.
      test:
        - 'CMD-SHELL'
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP'"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # --- application services (profile: app) --------------------------------

  # Named volumes are created root-owned, and Docker's propagation of image
  # directory ownership is not reliable across platforms. The API and worker run
  # as a non-root user (uid 10001) and must write per-tenant credentials, so the
  # volume's ownership is set explicitly by a one-shot root container rather
  # than left to chance.
  secrets-init:
    profiles: ['app']
    image: alpine:3.20
    user: root
    volumes:
      - eip_secrets:/data
    command: sh -c "mkdir -p /data && chown -R 10001:10001 /data && chmod 700 /data"
    restart: 'no'

  migrate:
    profiles: ['app']
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      target: migrate
    environment:
      # Runs as the migrator — the only role with DDL rights (guardrail 17).
      EIP_DB_MIGRATOR_DSN: postgresql+asyncpg://eip_migrator:local_dev_only@postgres:5432/eip
      EIP_ENV: local
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    profiles: ['app']
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      target: api
    environment:
      EIP_ENV: local
      EIP_LOG_FORMAT: console
      EIP_DB_APP_DSN: postgresql+asyncpg://eip_app:local_dev_only@postgres:5432/eip
      EIP_DB_PLATFORM_DSN: postgresql+asyncpg://eip_platform:local_dev_only@postgres:5432/eip
      EIP_DB_MIGRATOR_DSN: postgresql+asyncpg://eip_migrator:local_dev_only@postgres:5432/eip
      EIP_REDIS_URL: redis://redis:6379/0
      EIP_CORS_ORIGINS: http://localhost:3000
      EIP_AUTH_DEV_SIGNING_SECRET: local-dev-only-not-a-real-secret-change-me
      # Per-tenant analytical passwords live here, never in the database
      # (ADR-015). A named volume, not a bind mount: these must not land in the
      # working tree.
      EIP_SECRET_STORE_PATH: /var/lib/eip/secrets
      # Only the OIDC integration suite reads this. Inside the compose network
      # the provider is reachable by service name; from the host it is 8081.
      EIP_TEST_OIDC_BASE_URL: http://keycloak:8080
    ports:
      - '${EIP_API_HOST_PORT:-8000}:8000'
    volumes:
      # Bind-mounted for reload; the image already contains a copy.
      - ../apps/api/src:/app/apps/api/src:ro
      - ../apps/api/migrations:/app/apps/api/migrations:ro
      # Mounted so the integration and security suites can be run in the
      # container without a rebuild:
      #   docker compose -f infra/docker-compose.yml --profile app \
      #     run --rm api python -m pytest tests -q
      - ../apps/api/tests:/app/apps/api/tests:ro
      - ../apps/api/pyproject.toml:/app/apps/api/pyproject.toml:ro
      - eip_secrets:/var/lib/eip/secrets
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - 'CMD'
        - 'python'
        - '-c'
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    profiles: ['app']
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      target: worker
    environment:
      EIP_ENV: local
      EIP_LOG_FORMAT: console
      EIP_SERVICE_NAME: eip-worker
      EIP_DB_APP_DSN: postgresql+asyncpg://eip_app:local_dev_only@postgres:5432/eip
      EIP_SECRET_STORE_PATH: /var/lib/eip/secrets
      # NOTE: EIP_DB_PLATFORM_DSN is deliberately NOT supplied to the worker.
      # An ordinary worker must not hold a reusable BYPASSRLS credential
      # (ADR-009; Phase 1A finding 3). It reaches cross-tenant information only
      # through eip_outbox_pending_tenants(), which returns identifiers alone.
      EIP_REDIS_URL: redis://redis:6379/0
    ports:
      - '${EIP_WORKER_HOST_PORT:-8001}:8001'
    volumes:
      - ../apps/api/src:/app/apps/api/src:ro
      - ../apps/worker/src:/app/apps/worker/src:ro
      - eip_secrets:/var/lib/eip/secrets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - 'CMD'
        - 'python'
        - '-c'
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health', timeout=3).status==200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  eip_pgdata:
    name: eip_pgdata
  # Per-tenant analytical credentials. A volume rather than a bind mount so
  # secrets never appear in the working tree or in a build context.
  eip_secrets:
    name: eip_secrets
